<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Freire Despachante</title>
    <link rel="stylesheet" href="style.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&display=swap" rel="stylesheet">
</head>
<body>
    <header>
        <div class="container">
            <div class="logo">
                <img src="logo_aguia.png" alt="Logo Águia Freire Despachante">
            </div>
            <h1>Freire Despachante</h1>
            <p>Confiança, Seriedade e Agilidade</p>
        </div>
    </header>

    <main>
        <section class="servicos">
            <div class="container">
                <h2>Nossos Serviços</h2>
                <div class="servicos-grid">
                    <div class="servico-item">
                        <img src="icon_emplacamento.png" alt="Ícone Emplacamento">
                        <p>Emplacamento</p>
                    </div>
                    <div class="servico-item">
                        <img src="icon_licenciamento.png" alt="Ícone Licenciamento">
                        <p>Licenciamento</p>
                    </div>
                    <div class="servico-item">
                        <img src="icon_cnh.png" alt="Ícone Renovaçao CNH">
                        <p>Renovação CNH</p>
                    </div>
                    </div>
            </div>
        </section>

        <section class="contato">
            <div class="container">
                <h2>Fale Conosco</h2>
                </div>
        </section>
    </main>

    <footer>
        <div class="container">
            <p>&copy; 2023 Freire Despachante. Todos os direitos reservados.</p>
        </div>
    </footer>
</body>
</html>
